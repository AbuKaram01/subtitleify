[package]
name        = "subtitleify"
version     = "0.2.0"
edition     = "2021"
description = "Download, clean, and embed YouTube subtitles into videos"
license     = "GPL-3.0-or-later"
authors     = ["AbuKaram01"]
repository  = "https://github.com/AbuKaram01/subtitleify"
readme      = "README.md"

[[bin]]
name = "subtitleify"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
console     = "0.15"
isolang     = { version = "2", features = ["english_names"] }
dirs        = "5"
encoding_rs = "0.8"
glob        = "0.3"
indicatif   = "0.17"
regex       = "1"
serde_json  = "1"

# ── release optimizations ─────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

# ── .deb (cargo-deb) ──────────────────────────────────────────────────────────
[package.metadata.deb]
name               = "subtitleify"
maintainer         = "AbuKaram01"
copyright          = "2026, AbuKaram01"
license-file       = "LICENSE"
extended-description = """\
A fast CLI tool to download and clean YouTube subtitles.
Supports VTT and SRT output, playlists, multiple languages,
and subtitle merging into videos via ffmpeg. Fully flag-driven
for scripting."""
depends            = "$auto, ffmpeg"
section            = "utils"
priority           = "optional"
assets = [
    ["target/release/subtitleify", "usr/bin/", "755"],
]

# ── .rpm (cargo-generate-rpm) ─────────────────────────────────────────────────
[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/subtitleify", dest = "/usr/bin/subtitleify", mode = "755" },
]

[package.metadata.generate-rpm.requires]
ffmpeg = "*"
